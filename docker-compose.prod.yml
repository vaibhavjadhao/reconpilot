# Production-shaped stack: everything runs as a container, nothing is exposed
# that does not need to be, and every secret comes from the environment.
#
#   cp .env.example .env    # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml that matter:
#
#   * Only the frontend publishes ports. Postgres, Kafka and Redis are
#     reachable on the internal Docker network and from nowhere else. In the
#     dev file they are published so a laptop can reach them with psql; a
#     deployed database that answers the internet is a database that gets found.
#   * Services address each other by SERVICE NAME (postgres, kafka, backend),
#     which Docker resolves on the shared network. "localhost" inside a
#     container means that container, not the host.
#   * Everything restarts unless explicitly stopped, and waits for its
#     dependencies to be HEALTHY rather than merely started.
#   * nginx terminates TLS (ADR 0015) and port 80 only redirects to it.
#   * A backup container dumps the database on a schedule (ADR 0016). Prove the
#     backups restore, rather than assuming it:
#       docker compose -f docker-compose.prod.yml \
#           run --rm --entrypoint /ops/restore-drill.sh backup

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_OWNER_USER:?set DB_OWNER_USER in .env}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_OWNER_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The advertised listener is what clients are TOLD to connect to. In the
      # dev file this is localhost, because Spring runs on the host. Here the
      # backend is a container on the same network, so it must be the service
      # name -- localhost would send it back to itself.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing can be replicated. A real deployment needs at
      # least three brokers with a replication factor of 3, or a broker loss is
      # data loss.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-reconpilot_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      KAFKA_BOOTSTRAP: kafka:9092

      RECONPILOT_JWT_SECRET: ${RECONPILOT_JWT_SECRET:?set RECONPILOT_JWT_SECRET in .env}
      # Turns on StartupSecretCheck. The application refuses to start if any
      # credential is still a development default.
      RECONPILOT_REQUIRE_EXTERNAL_SECRETS: "true"

      # Still off by default: defect D7, the MDR rounding rule is unconfirmed.
      CLAIMS_FILING_ENABLED: ${CLAIMS_FILING_ENABLED:-false}

      AI_FORMAT_DISCOVERY_ENABLED: ${AI_FORMAT_DISCOVERY_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # The JVM reads the container limit, so -XX:MaxRAMPercentage=70 in the
          # Dockerfile gives roughly a 1.4 GB heap here. Change this number and
          # the heap follows; no rebuild needed.
          memory: 2G

  frontend:
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # selfsigned (default, local), provided (real certificate mounted
      # below), or off (a load balancer in front already terminates TLS).
      TLS_MODE: ${TLS_MODE:-selfsigned}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
    volumes:
      # The certificate lives in a volume, not in the image. A private key
      # baked into a layer is published to every registry and cache the image
      # ever touches, and cannot be recalled. For TLS_MODE=provided, replace
      # this line with a read-only bind mount of the real certificate:
      #   - /etc/letsencrypt/live/recon.example.com:/etc/nginx/tls:ro
      - tlsdata:/etc/nginx/tls
      - acmedata:/var/www/acme
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      # --no-check-certificate because in selfsigned mode the certificate is,
      # by definition, untrusted. This checks that nginx is serving, not that
      # the certificate is valid.
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost/ || wget -q -O /dev/null http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ------------------------------------------------------------- backups ----
  # Same image as the database, so pg_dump always matches the server version.
  # A pg_dump older than the server refuses to run; a newer one is fine, but
  # pinning them together removes the question.
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME}
      # The owner, not the app role: row-level security applies to the app
      # role, so a backup taken as reconpilot_app would silently contain only
      # the rows of whichever tenant happened to be set -- which is to say,
      # none of them.
      PGUSER: ${DB_OWNER_USER}
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-reconpilot_app}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./ops/backup:/ops:ro
      # A named volume keeps backups off the container, but still on the same
      # machine as the database. That survives a container being rebuilt; it
      # does not survive the machine. Anything real copies these to object
      # storage in another failure domain.
      - backups:/backups
    entrypoint: ["/ops/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/ops/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  backups:
  tlsdata:
  acmedata:
