spring.application.name=reconpilot

# --- Application runtime connection -----------------------------------------
# Connects as reconpilot_app: not the table owner, not a superuser, so
# PostgreSQL's row-level security policies actually apply. Every connection is
# stamped with the caller's tenant by TenantAwareDataSource.
#
# reWriteBatchedInserts collapses a JDBC batch into ONE multi-row INSERT
# statement instead of N single-row ones. Driver-level; no code change.
spring.datasource.url=jdbc:postgresql://localhost:5432/reconpilot?reWriteBatchedInserts=true
spring.datasource.username=reconpilot_app
spring.datasource.password=localdev_app
# The role is created by migration V6, so on a fresh database it does not exist
# when the pool is built. Lazy initialisation lets Flyway run first.
spring.datasource.hikari.initialization-fail-timeout=-1

# --- Owner connection, for migrations and cross-tenant system tasks ----------
app.datasource.admin.url=jdbc:postgresql://localhost:5432/reconpilot
app.datasource.admin.username=reconpilot
app.datasource.admin.password=localdev

# Flyway alters tables, so it must run as the owner, not as the app role.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/reconpilot
spring.flyway.user=reconpilot
spring.flyway.password=localdev

# Flyway owns the schema. Hibernate only checks that entities match what
# Flyway built -- it must never create or alter tables itself.
spring.jpa.hibernate.ddl-auto=validate

# --- Auth --------------------------------------------------------------------
# HS256 needs at least 256 bits of key material. Local-only value; in any real
# deployment this comes from the environment, never from a file in the repo.
reconpilot.jwt.secret=${RECONPILOT_JWT_SECRET:local-development-secret-change-me-0123456789abcdef}
reconpilot.jwt.ttl-minutes=120

# --- Claims ------------------------------------------------------------------
# Whether claims may actually be filed with a PSP.
#
# Off by default because of defect D7: the MDR rounding rule is unconfirmed
# (open question 5), and a one-paise disagreement produced 8,174 false breaks
# in a single 1,000,000-row run. Filing those would mean disputing charges that
# were correct. Drafting, reviewing and withdrawing work regardless; only the
# outward step is gated.
reconpilot.claims.filing-enabled=false

management.endpoints.web.exposure.include=health,info

# Uploads
#
# file-size-threshold=0 forces Spring to spool every upload straight to disk.
# The default keeps small uploads in memory, which is fine for an avatar and
# catastrophic for a 2 GB settlement file -- the heap would be gone long before
# any of our streaming code ran.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# Where uploads live between acceptance and processing. Spring deletes its own
# multipart temp file when the request ends, which is long before the async
# worker reads it, so we keep our own copy with a lifetime we control.
reconpilot.ingest.staging-dir=${java.io.tmpdir}/reconpilot-staging
