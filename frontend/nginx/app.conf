# The application itself: static assets plus the /api proxy.
#
# This file is INCLUDED into a server block rather than being one, so the same
# routing serves plain HTTP and TLS without being written twice. Two copies of
# routing rules drift -- one gets a fix and the other does not, and the bug
# only shows up on whichever scheme you were not testing.

root /usr/share/nginx/html;
index index.html;

# Hashed asset filenames change whenever content changes, so they can be
# cached indefinitely. index.html must NOT be, or a browser keeps serving
# a stale page that references assets the new deploy has deleted.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # nginx inherits add_header from the enclosing block ONLY when the current
    # block declares none of its own. The line above therefore erases every
    # server-level security header for this location, so they have to be
    # repeated. This is the single most-missed nginx gotcha: the headers look
    # present because they are present on the pages you happened to check.
    include /etc/nginx/snippets/security-headers.conf;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}

# A single-page app owns its own routes. The browser asking for
# /claims/abc-123 must get index.html, not a 404 -- React Router resolves
# the path once the app has loaded. Without this, every deep link and every
# page refresh away from / is broken.
location / {
    try_files $uri $uri/ /index.html;
}

# The frontend calls a relative /api, so in production this proxy is what
# the Vite dev proxy was standing in for. The browser sees ONE origin, so
# CORS never enters the picture -- in development or in production.
location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The backend is reached over plain HTTP on the Docker network, so without
    # this header it would believe the user's connection was http:// and could
    # hand out http links or non-Secure cookies on a page loaded over TLS.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Settlement files are large and ingestion is a streamed upload.
    client_max_body_size 2G;
    proxy_request_buffering off;   # stream through, do not spool 2 GB first
    proxy_read_timeout 300s;
}

location /actuator/health {
    proxy_pass http://backend:8080/actuator/health;
}
