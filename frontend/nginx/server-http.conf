# TLS_MODE=off
#
# Plain HTTP on port 80. This is the right configuration when something in
# front of this container already terminates TLS -- a cloud load balancer, an
# ingress controller, a Cloudflare tunnel. Terminating twice buys nothing and
# means two certificates to renew instead of one.
#
# It is the WRONG configuration when this container faces the internet
# directly. Bearer tokens and settlement rows would travel in clear.
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app.conf;
}
