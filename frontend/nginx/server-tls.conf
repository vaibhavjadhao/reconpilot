# TLS_MODE=selfsigned | provided
#
# Port 80 exists only to send browsers to port 443, and to answer the ACME
# challenge so a certificate can be renewed without taking the site down.
server {
    listen 80;
    server_name _;

    # Let's Encrypt (and any other ACME client) proves domain control by
    # fetching a file over PLAIN HTTP. If the redirect below caught this path
    # too, renewal would fail every 60 days -- quietly, until the certificate
    # expired on a weekend.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 is kept for older corporate proxies; everything below it is
    # broken beyond repair and nginx will not negotiate it.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS 1.3 clients choose better than we can
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Resuming a session skips a full handshake. 10 MB holds roughly 40,000
    # sessions; 1 day is long enough to help and short enough to bound the
    # value of a stolen ticket key.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Written at startup by 20-reconpilot-tls.sh. Carries HSTS only when the
    # certificate is a real one.
    include /etc/nginx/snippets/security-headers.conf;

    include /etc/nginx/snippets/app.conf;
}
